name: Check

# Nothing ran on a pull request before this file existed.
#
# That is not a hypothetical gap. A change moved the room list out of
# BottomDock into lib/rooms and left the width probe in dock.spec.ts reading
# the old place, so it matched nothing, measured an empty row, and passed --
# and the guard test written for exactly that case went red on main and stayed
# red, because nobody was running it. It was found by hand, two merges later.
#
# So: every pull request, and every push to main.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a branch makes the run in progress pointless.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # v5 of setup-node started caching on its own from package.json's
      # packageManager field. `cache: npm` is still the explicit answer and
      # this repo has no packageManager field, so it stays spelled out.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Separately rather than through `npm run check`, so the summary says
      # which one failed instead of just that something did.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # The build is its own failure mode: a route can typecheck and still
      # refuse to compile.
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100

  # The rules that protect the game, run against a real Postgres.
  #
  # These are the 400-odd assertions in supabase/tests: that a player reads
  # only their own row and writes none of it, that a rating cannot be raised
  # by the person it belongs to, that coins cannot be conjured, that settling
  # a week twice settles it once. Every one of them was written, and none of
  # them ran here -- so a migration could have taken row level security off a
  # table and this file would have gone green.
  #
  # That is the same failure the note at the top of this file is about, one
  # layer down: a guard nobody runs is a guard reporting a pass it did not
  # earn.
  db:
    name: Migrations, triggers, row level security
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Without this the job starts psql before the server is listening and
        # fails on connection rather than on anything it was asked to check.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v7

      # The runner image ships a client, but not necessarily one that matches
      # the server. Installing 16 keeps the two in step.
      - name: Install the matching psql
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16

      - run: ./scripts/test-db.sh

  # A backup nobody has ever restored is a belief rather than a backup.
  #
  # This builds a database from the migrations, puts a trade in it, backs it
  # up with the same script the nightly workflow runs, restores that backup
  # into an empty database and checks that what comes back is what went in,
  # foreign keys and all. It needs no production credentials, so it can run on
  # every pull request rather than once a year in an emergency.
  restore:
    name: The backup restores
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v7

      - name: Install the matching psql and pg_dump
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16

      - run: ./scripts/restore-rehearsal.sh

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # These drive a signed-out app, and the proxy that redirects a
      # signed-out visitor to the sign-in page is switched off when Supabase
      # is unconfigured -- so without a URL and a key the suite fails on the
      # redirect tests for a reason that has nothing to do with the change
      # under review.
      #
      # They do not have to name a real project. Every test in this suite is
      # signed out, and supabase-js answers getUser() from storage before it
      # ever reaches the network: with no session cookie there is no session
      # and it says so without making a request. Nothing here talks to the
      # host below. What these values do is make isSupabaseConfigured true,
      # which is the switch the proxy actually reads.
      #
      # They were repository secrets, which sounded safer and was worse. An
      # unset secret is an empty string, so the job skipped the tests and the
      # check went green in twenty seconds having run nothing -- a guard
      # reporting a pass it did not earn, which is the exact failure this
      # file was written to stop. Written here they cannot be unset.
      - run: npx playwright install --with-deps chromium

      # Google is the only way in since the magic link went, so the same
      # argument applies to a client id: with none set, the sign-in button
      # does not render and the landing tests fail for a reason that has
      # nothing to do with the change under review. Nothing here reaches
      # Google; every test stops at the button.
      - run: npx playwright test
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-no-project-behind-it
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
          GOOGLE_CLIENT_ID: placeholder.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: placeholder-secret-no-client-behind-it

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  instant:
    name: Rooms arrive whole
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # A signed-in player, invented, and a data layer told to be slow, so a
      # room that arrives in pieces can be told from one that arrives whole.
      # Everything this needs is set in playwright.instant.config.ts, and
      # nothing it needs is set by a deployment.
      #
      # Its own job rather than another file in the suite above, because it
      # needs a server with the sign-in lock switched off and that suite exists
      # to check the lock is on.
      - run: npm run test:instant

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: instant-report
          path: playwright-report/
          retention-days: 7

      # Whether each room can be prerendered at all, which the browser probe
      # above cannot see: a route with no shell simply makes the browser wait
      # and then paints everything at once, which looks like arriving whole.
      # This asks the framework instead, and it names the offending line.
      # Bounded, because the placeholder upstreams this renders against can
      # hang on a runner rather than refuse quickly, and a step with no ceiling
      # is one that fails by running until somebody notices.
      - run: npm run check:prerender
        timeout-minutes: 10
