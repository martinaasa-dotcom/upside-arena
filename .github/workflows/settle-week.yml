name: Settle the finished week

# Nudges the app to settle a finished week, once the week is actually finished.
#
# This is not what makes settling correct. The app settles a due week by
# itself on the first request that touches the game, so a week is never left
# unscored because a schedule slipped. This only makes it prompt on a quiet
# weekend when nobody has visited yet.
#
# GitHub's scheduler can run late when it is busy, and that is fine here:
# scoring is idempotent, so arriving late, twice, or not at all all end in the
# same place.
#
# It used to run on Friday evening, shortly after the 16:00 close in New York,
# which sounds right and never worked. due_cycles asks `monday + 4 < p_today`,
# and p_today is the New York calendar date -- so a week stops being current
# when the date rolls over to Saturday, not when the market shuts on Friday.
# Every Friday run therefore found nothing due and returned having settled
# nothing, which is precisely the quiet weekend this file exists for.
#
# So: Saturday, after New York has reached it. 05:10 UTC is 01:10 in New York
# in summer and 00:10 in winter, so both are safely Saturday there. A second
# pass at 11:10 lands before the Saturday notification runs at 14:00, and a
# Sunday pass covers a scheduler that missed both.

on:
  schedule:
    - cron: "10 5 * * 6"
    - cron: "10 11 * * 6"
    - cron: "10 11 * * 0"
  workflow_dispatch:

concurrency:
  group: settle-week
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the app to settle
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://upsidearena.com' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set on this repository. Nothing to do."
            echo "The app still settles finished weeks by itself on the next visit."
            exit 0
          fi

          response=$(mktemp)
          code=$(curl -sS --max-time 90 -o "$response" -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/settle")

          echo "HTTP $code"
          cat "$response"
          echo

          # A failure here is not an emergency. The next visitor settles it.
          if [ "$code" != "200" ]; then
            echo "::warning::Settle endpoint returned $code. The app will settle on the next request."
          fi
